name: Publish server manager release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml

permissions:
  contents: read

concurrency:
  group: publish-server-manager-v1.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gsshunter-models/capy-baras-server-manager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out verified release files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify the tested Windows app
        shell: bash
        run: |
          set -euo pipefail
          cd app
          tr -d '\r' < SHA256SUMS.txt | sha256sum --check -
      - name: Publish v1.1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 app/CapyBaraServerManager-v1.1.0-windows-portable.zip app/SHA256SUMS.txt --clobber
          else
            gh release create v1.1.0 app/CapyBaraServerManager-v1.1.0-windows-portable.zip app/SHA256SUMS.txt --target "$RELEASE_TARGET" --title "Capy Bara's Server Manager v1.1.0" --notes-file docs/releases/v1.1.0.md --latest
          fi
